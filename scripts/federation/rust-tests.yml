services:
  rust-tests:
    image: soundtime-federation-rust-tests:${COMPOSE_PROJECT_NAME}
    pull_policy: never
    build:
      context: ../../backend
      dockerfile: ../docker/Dockerfile.backend
      target: federation-rust-tests
    environment:
      TEST_DATABASE_URL: postgres://soundtime:federation-test@db-a/soundtime_federation_rust
      P2P_PUBLIC_DISCOVERY: "false"
      P2P_DHT_DISCOVERY: "false"
      P2P_LOCAL_DISCOVERY: "false"
      CARGO_NET_OFFLINE: "true"
    networks: [site-a]
