resolver 127.0.0.11 valid=5s ipv6=off;
upstream catalogue_readers {
    zone catalogue_readers 64k;
    least_conn;
    server catalog-http:8080 resolve;
    keepalive 16;
}
map "$request_method:$arg_include_p2p" $catalogue_route {
    default backend;
    "GET:" catalogue_readers;
    "GET:false" catalogue_readers;
    "HEAD:" catalogue_readers;
}
