name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Finish the current main release before another one can move the latest tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks and images
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      private-listening: ${{ steps.paths.outputs.private-listening }}
      images: ${{ steps.paths.outputs.images }}
      matrix: ${{ steps.paths.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        run: python3 .github/scripts/ci-changes.py
      - name: Validate installer and Compose configurations
        if: steps.paths.outputs.config == 'true'
        env:
          JWT_SECRET: local-ci-validation-only
          NFS_SERVER: 192.0.2.10
          NFS_EXPORT: /music
          SMB_SERVER: 192.0.2.11
          SMB_SHARE: music
          SMB_USERNAME: example
          SMB_PASSWORD: example
        run: |
          bash -n install.sh
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker/compose.nfs.yml config --quiet
          docker compose -f docker-compose.yml -f docker/compose.smb.yml config --quiet
          docker compose -f docker-compose.yml -f docker/compose.nfs.yml -f docker/compose.smb.yml config --quiet

  backend-check:
    name: Backend (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: -Dwarnings
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soundtime
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: soundtime
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U soundtime"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - name: Lint all targets and features
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test the workspace including PostgreSQL reconciliation
        env:
          TEST_DATABASE_URL: postgres://soundtime:ci@localhost:${{ job.services.postgres.ports['5432'] }}/soundtime
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --locked --workspace --all-features -- --include-ignored

  frontend-check:
    name: Frontend (types and coverage)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:coverage
      # The native container builds compile the production frontend on both platforms.

  private-listening:
    name: Private listening through Nginx
    needs: [changes, docker-release-build]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.private-listening == 'true' &&
      (github.event_name == 'pull_request' || needs.docker-release-build.result == 'success')
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download the native candidate digests
        if: github.event_name == 'push'
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-digest-*-amd64
          path: ${{ runner.temp }}/listening-digests
      - name: Authenticate to the candidate registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select the exact release images for playback
        if: github.event_name == 'push'
        shell: bash
        run: |
          for component in backend frontend; do
            digest=$(cat "$RUNNER_TEMP/listening-digests/image-digest-$component-amd64/digest")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soundtime-$component@$digest"
            docker pull "$image"
            echo "QA_${component^^}_IMAGE=$image" >> "$GITHUB_ENV"
          done
          echo 'QA_USE_BUILT_IMAGES=1' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Run the private instance browser suite
        run: scripts/test-private-listening.sh
      - name: Keep acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-listening-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  docker-build:
    name: Check native Docker builds
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.images == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/container-build.yml
    with:
      matrix: ${{ needs.changes.outputs.matrix }}

  docker-release-build:
    name: Build native release images
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-build.yml
    with:
      matrix: ${{ needs.changes.outputs.matrix }}

  docker-publish:
    name: Publish multi-platform images
    runs-on: ubuntu-24.04
    needs: [changes, backend-check, frontend-check, private-listening, docker-release-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - name: Download release digests
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/release-digests

      - name: Validate all four release digests
        run: |
          root="$RUNNER_TEMP/release-digests"
          files=("$root"/image-digest-*/digest)
          [[ ${#files[@]} -eq 4 ]] || { echo "Expected four digest artifacts" >&2; exit 1; }
          for component in backend frontend; do
            for arch in amd64 arm64; do
              digest=$(cat "$root/image-digest-$component-$arch/digest")
              if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "Invalid digest for $component ($arch)" >&2
                exit 1
              fi
            done
          done
          [[ $(cat "${files[@]}" | sort -u | wc -l) -eq 4 ]]

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Assemble and verify both release indexes
        shell: bash
        run: |
          root="$RUNNER_TEMP/release-digests"
          for component in backend frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soundtime-$component"
            sources=()
            for arch in amd64 arm64; do
              digest=$(cat "$root/image-digest-$component-$arch/digest")
              sources+=("$image@$digest")
            done
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              --metadata-file "$root/$component.json" \
              --tag "$image:${GITHUB_SHA:0:7}" "${sources[@]}"
            index=$(jq -er '."containerimage.descriptor".digest | select(test("^sha256:[a-f0-9]{64}$"))' "$root/$component.json")
            docker buildx imagetools inspect --raw "$image@$index" | jq -e '
              [.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
               | .platform | [.os, .architecture]] | sort == [["linux","amd64"],["linux","arm64"]]'
          done

      - name: Promote the verified indexes to latest
        run: |
          for component in backend frontend; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soundtime-$component"
            index=$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/release-digests/$component.json")
            docker buildx imagetools create --tag "$image:latest" "$image@$index"
          done
