name: SoundTime CLI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version to publish, for example installer-v2.0.0"
        type: string
        required: false
  pull_request:
    paths:
      - 'installer/**'
      - 'docker-compose.yml'
      - 'docker/nginx.conf'
      - '.github/workflows/installer.yml'

permissions:
  contents: read

jobs:
  integration:
    name: Install, configure, resume and verify an S3 upload
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s installer/tests -v
      - run: python installer/tests/smoke_docker.py
      - run: python installer/tests/smoke_export.py

  package:
    name: Run CLI on ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-26, host: macos-arm64}
          - {runner: macos-15-intel, host: macos-x64}
          - {runner: windows-2025, host: windows-x64}
          - {runner: windows-11-arm, host: windows-arm64}
          - {runner: ubuntu-22.04, host: linux-x64}
          - {runner: ubuntu-22.04-arm, host: linux-arm64}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test native shell argument and exit-code handling
        run: python -m unittest discover -s installer/tests -p test_wrappers.py -v
      - run: python -m pip install -r installer/packaging/requirements.txt
      - run: python installer/packaging/build.py
      - run: python installer/packaging/verify.py
      - name: Install and configure over real SSH with the packaged CLI
        if: matrix.host == 'linux-x64'
        run: bash installer/tests/smoke_ssh.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.host }}
          path: dist/installer/bin/${{ matrix.host }}/soundtime*
          if-no-files-found: error
          compression-level: 0

  bundle:
    needs: [package, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: staging/bin
      - run: python3 installer/packaging/build.py --assemble staging
      - working-directory: dist/installer
        run: |
          sha256sum -c SoundTime-CLI.zip.sha256
          unzip -q SoundTime-CLI.zip -d extracted
          extracted/soundtime --lang fr --help
      - uses: actions/upload-artifact@v7
        with:
          name: SoundTime-CLI
          path: dist/installer/SoundTime-CLI.zip*
          compression-level: 0

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != ''
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SoundTime-CLI
      - name: Publish portable CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^installer-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha256sum -c SoundTime-CLI.zip.sha256
          gh release create "$RELEASE_TAG" SoundTime-CLI.zip SoundTime-CLI.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "SoundTime CLI ${RELEASE_TAG#installer-v}" \
            --notes 'Extract the complete SoundTime-CLI.zip. On macOS or Linux, run `./soundtime`. In Windows PowerShell run `.\soundtime.cmd`; in cmd run `soundtime.cmd`. The terminal wizard detects the local or remote host, supports NAS project export, and includes English, French, Spanish, Russian and Chinese. No Python installation is required. [Setup guide and manual Docker Compose installation](https://github.com/CICCADA-CORP/SoundTime#quick-start).'
