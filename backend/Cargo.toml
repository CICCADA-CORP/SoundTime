[workspace]
resolver = "2"
members = [
  "crates/soundtime-server",
  "crates/soundtime-audio",
  "crates/soundtime-db",
  "crates/soundtime-migration",
  "crates/soundtime-p2p",
  "crates/soundtime-plugin",
]

[workspace.package]
license = "AGPL-3.0-or-later"

# The deployed server uses PostgreSQL, UUIDs, JSON and chrono timestamps.
[workspace.dependencies]
sea-orm = { version = "1.1", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }

# ── Build profiles ───────────────────────────────────────────────────

# CI profile: fast compilation, minimal optimization (used by CI checks)
[profile.ci]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = "none"

# Release: optimized for binary size and speed
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Dev: fast incremental builds
[profile.dev]
opt-level = 0
debug = true
incremental = true

# Dev dependencies at higher opt-level (speeds up symphonia/iroh in dev)
[profile.dev.package."*"]
opt-level = 1
