[package]
name = "soundtime-server"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
sea-orm.workspace = true
sea-orm-migration.workspace = true
argon2 = "0.5"
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
rand = "0.9"
tower_governor = "0.8"
password-hash = { version = "0.5", features = ["std"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
urlencoding = "2"
bytes = "1"
futures-util = "0.3"
toml = "0.8"
regex = "1"
git2 = { version = "0.21", features = ["https", "ssh"] }
tempfile = "3"
md5 = "0.7"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"

deadpool-redis = { version = "0.18", optional = true }

soundtime-audio = { path = "../soundtime-audio" }
soundtime-db = { path = "../soundtime-db" }
soundtime-migration = { path = "../soundtime-migration" }
soundtime-p2p = { path = "../soundtime-p2p" }
soundtime-plugin = { path = "../soundtime-plugin" }

[features]
default = []
redis = ["deadpool-redis", "soundtime-db/redis"]

[dev-dependencies]
axum-test = "16"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
